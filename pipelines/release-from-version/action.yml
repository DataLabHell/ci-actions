name: 'Release from VERSION file'
description: 'One-step release: resolve the next version from a MAJOR.MINOR file (auto patch), tag it + move vX / vX.Y aliases, and publish a GitHub Release.'
author: 'DataLabHell'

branding:
  icon: 'rocket'
  color: 'blue'

# A "pipeline" action: it just chains this repo's smaller actions (by full ref,
# like github-release wraps softprops). The caller still owns the job — provide
# a runner, `permissions: contents: write`, and check out with fetch-depth: 0.
inputs:
  version-file:
    description: 'Path to the MAJOR.MINOR version file'
    required: false
    default: 'VERSION'
  github-token:
    description: 'Token for the GitHub Release. Required when create-release is true. Pass secrets.GITHUB_TOKEN.'
    required: false
    default: ''
  create-release:
    description: 'Publish a GitHub Release (set "false" to only create the tag)'
    required: false
    default: 'true'

outputs:
  tag:
    description: 'The tag released, e.g. v0.1.3'
    value: ${{ steps.ver.outputs.tag }}

runs:
  using: 'composite'
  steps:
    - id: ver
      uses: DataLabHell/ci-actions/actions/versioning/auto-patch@v0
      with:
        file: ${{ inputs.version-file }}

    - uses: DataLabHell/ci-actions/actions/release/tag-and-alias@v0
      with:
        tag: ${{ steps.ver.outputs.tag }}

    - if: ${{ inputs.create-release == 'true' }}
      uses: DataLabHell/ci-actions/actions/release/github-release@v0
      with:
        tag: ${{ steps.ver.outputs.tag }}
        github-token: ${{ inputs.github-token }}
