name: "Python lint"
description:
  "Lint and type-check a Python project with ruff (check + format) and ty, via
  uv."
author: "DataLabHell"

branding:
  icon: "check-circle"
  color: "blue"

# ruff runs via the official ruff-action; ty (no official action) via uv, only
# when type-check is not "off". The caller owns the job (runner, checkout).
inputs:
  paths:
    description: "Space-separated paths for ruff check + format"
    required: false
    default: "."
  type-check:
    description:
      "ty type check: warn (soft-fail with a warning), error (hard fail), or off"
    required: false
    default: "warn"
  type-check-paths:
    description:
      "Space-separated paths for ty (used only when type-check is not off)"
    required: false
    default: "."
  sync-args:
    description:
      'Args for "uv sync" run before ty, which resolves against the project env'
    required: false
    default: "--all-groups"

runs:
  using: "composite"
  steps:
    - name: check
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0 # Renovate digest-pins this
      with:
        args: check
        src: ${{ inputs.paths }}

    - name: format
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0 # Renovate digest-pins this
      with:
        args: format --check
        src: ${{ inputs.paths }}

    - name: Install uv (for ty)
      if: ${{ inputs.type-check != 'off' }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false

    - name: ty
      if: ${{ inputs.type-check != 'off' }}
      shell: bash
      run: bash "${{ github.action_path }}/ty.sh"
      env:
        INPUT_TYPE_CHECK: ${{ inputs.type-check }}
        INPUT_TYPE_CHECK_PATHS: ${{ inputs.type-check-paths }}
        INPUT_SYNC_ARGS: ${{ inputs.sync-args }}
