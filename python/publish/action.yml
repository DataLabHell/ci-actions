name: "Python publish"
description:
  "Build a Python project with uv and publish it to the internal devpi index
  (credentials and URL from Vault); already-published versions are a no-op."
author: "DataLabHell"

branding:
  icon: "upload-cloud"
  color: "blue"

# Installs uv (via setup-uv), then builds and publishes. Publishing is gated on
# the branch: by default only "main" publishes, so the same workflow can run on
# feature branches without pushing anything. The caller owns the job (runner,
# checkout) and resolves the version with one of the versioning/ actions (see
# the README) — this action only pretends it to setuptools-scm when the project
# uses dynamic versioning.
inputs:
  version:
    description:
      "Version to publish, bare X.Y.Z (from versioning/auto-patch or
      versioning/from-pyproject). Required for projects with dynamic versioning;
      ignored for projects with a fixed [project].version."
    required: false
    default: ""
  release-branch:
    description:
      "The only branch that publishes a final version; every other ref publishes
      a prerelease (or nothing)."
    required: false
    default: "main"
  publish-other-branches:
    description:
      'Also publish from refs other than release-branch, as
      "X.Y.Z.dev0+<short-sha>"'
    required: false
    default: "false"
  build:
    description: 'Run "uv build" before publishing'
    required: false
    default: "true"
  build-args:
    description: 'Extra args passed to "uv build"'
    required: false
    default: ""

outputs:
  published:
    description: '"true" if the publish step ran, "false" if it was skipped'
    value: ${{ steps.publish.outputs.published || 'false' }}
  version:
    description: "The version that was published (empty when skipped)"
    value: ${{ steps.publish.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    # Authenticates with the job's OIDC token, so the caller needs
    # "permissions: id-token: write" (see the README). exportEnv is off: the
    # secrets stay in this step's outputs instead of leaking into the
    # environment of every later step in the caller's job.
    - name: Get devpi credentials
      id: vault
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: https://vault1.dlh-k8s.com:8200
        method: jwt
        role: ci-actions
        exportEnv: "false"
        secrets: |
          kv/data/k8s/devpi/users ci-actions | UV_PUBLISH_PASSWORD;
          kv/data/k8s/devpi/config url | DEVPI_URL

    - name: Publish
      id: publish
      shell: bash
      run: bash "${{ github.action_path }}/publish.sh"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_RELEASE_BRANCH: ${{ inputs.release-branch }}
        INPUT_PUBLISH_OTHER_BRANCHES: ${{ inputs.publish-other-branches }}
        INPUT_BUILD: ${{ inputs.build }}
        INPUT_BUILD_ARGS: ${{ inputs.build-args }}
        UV_PUBLISH_USERNAME: ci-actions
        UV_PUBLISH_PASSWORD: ${{ steps.vault.outputs.UV_PUBLISH_PASSWORD }}
        DEVPI_URL: ${{ steps.vault.outputs.DEVPI_URL }}
