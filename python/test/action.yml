name: "Python test"
description:
  "Install a Python project with uv and run pytest, optionally pinned to a
  Python version."
author: "DataLabHell"

branding:
  icon: "check-square"
  color: "blue"

# Runs on any runner that has uv installed. One Python version per invocation;
# the caller owns the matrix (see the README). The caller owns the job too
# (runner, checkout).
inputs:
  python-version:
    description:
      'Python version to test against, e.g. "3.13". Empty uses the project
      default.'
    required: false
    default: ""
  sync-args:
    description: 'Args passed to "uv sync"'
    required: false
    default: "--all-groups --all-extras"
  pytest-args:
    description: "Extra args passed to pytest"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/test.sh"
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
        INPUT_SYNC_ARGS: ${{ inputs.sync-args }}
        INPUT_PYTEST_ARGS: ${{ inputs.pytest-args }}
