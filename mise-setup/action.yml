name: "mise setup"
description:
  "Provision a project's tools with mise into a per-repository dir, with a cache
  over the install dirs and a prune of unreferenced versions."
author: "DataLabHell"

branding:
  icon: "download-cloud"
  color: "blue"

inputs:
  global:
    description:
      "Install into the runner-wide mise dirs (~/.local/share/mise,
      ~/.cache/mise) instead of a per-repository dir. Set this only where
      sharing one set of tool versions across every repo on the runner is what
      you want."
    required: false
    default: "false"
  cache:
    description:
      "Cache the mise install dirs with actions/cache. Set to false to install
      into a throwaway dir under RUNNER_TEMP with no cache and no reuse of
      earlier installs, so every tool downloads fresh. false overrides global."
    required: false
    default: "false"
  task-state:
    description:
      "Cache mise's task freshness state so tasks whose sources are unchanged
      since their last green run skip. Applies only when the project sets
      task.source_freshness_hash_contents = true."
    required: false
    default: "true"
  minimum-release-age:
    description: "Ignore mise releases younger than this age."
    required: false
    default: "24h"

# Composite wrapper around jdx/mise-action. The caller owns the job (runner,
# checkout). Third-party actions are pinned to a commit SHA, not a tag.
runs:
  using: "composite"
  steps:
    # Point mise at a per-repository dir before anything installs, so tool
    # versions don't pile up in one runner-wide directory across projects.
    - id: dirs
      shell: bash
      run: bash "${{ github.action_path }}/dirs.sh"
      env:
        INPUT_GLOBAL: ${{ inputs.global }}
        INPUT_CACHE: ${{ inputs.cache }}

    # mise-action's built-in caching is turned off below and replaced by this
    # step, which caches the install dirs directly.
    # See https://github.com/jdx/mise-action/issues/537
    #
    # The key ends in a hash of the mise config, so editing the config produces a
    # new key and the updated tool set gets written back. restore-keys then seeds
    # that fresh key from the previous entry, leaving only the changed tools to
    # install rather than the whole set.
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.dirs.outputs.data-dir }}/installs
          ${{ steps.dirs.outputs.data-dir }}/plugins
          ${{ steps.dirs.outputs.cache-dir }}
        key: |-
          mise-${{ github.event.repository.name }}-${{ runner.os }}-${{ hashFiles('**/mise.lock', '**/mise*.toml', '**/.mise*.toml', '**/.tool-versions') }}
        restore-keys: |
          mise-${{ github.event.repository.name }}-${{ runner.os }}-

    - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        minimum_release_age: ${{ inputs.minimum-release-age }}
        experimental: true
        cache: false

    - id: freshness
      if: inputs.task-state == 'true'
      shell: bash
      run: |
        hash=$(mise settings get task.source_freshness_hash_contents 2>/dev/null || echo false)
        echo "hash=$hash" >>"$GITHUB_OUTPUT"
        if [ "$hash" != "true" ]; then
          echo "::notice::task-state skipped: restored state is only safe with task.source_freshness_hash_contents = true"
        fi

    # Keyed per run and job: GitHub never overwrites a key, and parallel jobs
    # would collide on a shared one.
    - if: steps.freshness.outputs.hash == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.dirs.outputs.state-dir }}/task-sources
        key: |-
          mise-tasks-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          mise-tasks-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
