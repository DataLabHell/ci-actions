name: "Version (auto patch)"
description:
  "Read MAJOR.MINOR from a version file and auto-increment the patch from
  existing tags; output the next bare version X.Y.Z."
author: "DataLabHell"

branding:
  icon: "hash"
  color: "blue"

inputs:
  file:
    description: 'Path to the file holding MAJOR.MINOR (e.g. "0.1")'
    required: false
    default: "VERSION"
  prefix:
    description:
      "Prefix on existing git tags, used only to find this series (e.g. v for
      v0.1.*)"
    required: false
    default: "v"

outputs:
  version:
    description:
      "The next bare version, e.g. 0.1.3 (feed into release/tag-and-alias)"
    value: ${{ steps.read.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Compute next version
      id: read
      shell: bash
      run: bash "${{ github.action_path }}/version.sh"
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_PREFIX: ${{ inputs.prefix }}
