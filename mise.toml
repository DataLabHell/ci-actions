[settings]
# safer in ci workloads than the default
npm.package_manager = "npm"

[tools]
# dependencies
## lts, provides npm
node = "v24.18.1"
## required by renovate scripts
"aqua:jqlang/jq" = "1.8.2"

# linters
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mpalmer/action-validator" = "0.9.0"
"aqua:mvdan/sh" = "3.13.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:tamasfe/taplo" = "0.10.0"
"npm:prettier" = "3.9.6"
"npm:renovate" = "44.7.4"

###########
# Linting #
###########

[tasks.lint]
description = "Lint all languages"
depends = [
  "lint:bash",
  "lint:renovate",
  "lint:schemas",
  "lint:toml",
  "lint:workflows",
]

[tasks."lint:schemas"]
description = "Validate every action.yml and workflow against its GitHub schema"
run = '''
# Running action-validator
files=$(git ls-files --cached --others --exclude-standard \
  'action.yml' '*/action.yml' '.github/workflows/*.yml' '.github/workflows/*.yaml')
if [ -n "$files" ]; then action-validator $files; else echo "no action or workflow files found"; fi
'''

[tasks."lint:workflows"]
description = "Lint GitHub workflows with actionlint"
run = "actionlint"

[tasks."lint:bash"]
description = "Lint shell scripts with shellcheck"
run = '''
# Running shellcheck
files=$(git ls-files --cached --others --exclude-standard '*.sh' '*.bash')
if [ -n "$files" ]; then shellcheck $files; else echo "no shell scripts found"; fi
'''

[tasks."lint:renovate"]
description = "Validate renovate.json against its schema (strict)"
run = "renovate-config-validator --strict"

[tasks."lint:toml"]
description = "Lint TOML files with taplo"
run = "taplo lint"

##############
# Formatting #
##############

[tasks.format]
description = "Format all languages (pass `check` to verify only)"
usage = 'arg "[mode]" help="pass `check` to verify without modifying"'
run = '''
# Running format
if [ "$usage_mode" = check ]; then
  mise run "format:_check"
else
  mise run "format:_write"
fi
'''

[tasks."format:_write"]
hide = true
depends = ["format:bash", "format:prettier", "format:toml"]

[tasks."format:_check"]
hide = true
depends = ["format:bash check", "format:prettier check", "format:toml check"]

[tasks."format:bash"]
description = "Format shell scripts with shfmt (pass `check` to verify only, `--file` for a single file)"
usage = '''
arg "[mode]" help="pass `check` to verify without modifying"
flag "--file <path>" help="format only this file"
'''
run = '''
# Running shfmt (2-space indent, indented case branches)
if [ -n "$usage_file" ]; then
  target="$usage_file"
else
  target=$(git ls-files --cached --others --exclude-standard '*.sh' '*.bash')
fi
if [ -z "$target" ]; then echo "no shell scripts found"; exit 0; fi
if [ "$usage_mode" = check ]; then
  shfmt -i 2 -ci -d $target
else
  shfmt -i 2 -ci -w $target
fi
'''

[tasks."format:prettier"]
description = "Format YAML/Markdown/JSON with prettier (pass `check` to verify only, `--file` for a single file)"
usage = '''
arg "[mode]" help="pass `check` to verify without modifying"
flag "--file <path>" help="format only this file"
'''
run = '''
# Running prettier (skips extensions it has no parser for, e.g. .sh and .toml)
target="${usage_file:-.}"
if [ "$usage_mode" = check ]; then
  prettier --check "$target"
else
  prettier --write "$target"
fi
'''

[tasks."format:toml"]
description = "Format TOML files with taplo (pass `check` to verify only, `--file` for a single file)"
usage = '''
arg "[mode]" help="pass `check` to verify without modifying"
flag "--file <path>" help="format only this file"
'''
run = '''
# Running taplo
if [ "$usage_mode" = check ]; then
  taplo fmt --check $usage_file
else
  taplo fmt $usage_file
fi
'''

################
# Dependencies #
################

[tasks.renovate]
description = "Preview, gate, or apply dependency updates with renovate"
# `depends` would swallow the mode and flags; an alias forwards them
alias = "dependencies"
usage = '''
arg "[mode]" help="`check` exits non-zero when updates exist; `apply` rewrites the manifests renovate.json would automerge"
flag "--force" help="with apply, also rewrite manual/major bumps"
'''
run = '''
tools/local-renovate/local-renovate.sh $usage_mode ${usage_force:+--force}
# refresh the installed tools to match the rewritten pins
if [ "$usage_mode" = apply ]; then
  echo "Running mise install..."
  mise install
  echo "Pruning stale mise versions..."
  mise prune -y
  echo "Updating lock file..."
  mise lock
  echo "Done upgrading dependencies"
fi
'''

###########
# Testing #
###########

[tasks.test]
description = "Run the local-renovate fixture tests"
run = "tools/local-renovate/tests/run.sh"

#############
# Harnesses #
#############

[tasks.check]
description = "Full quality gate (fmt, lint, test)"
depends = ["format check", "lint", "test"]
