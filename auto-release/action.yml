name: 'Auto Release'
description: 'VERSION-file driven releases: auto-increment the patch, tag, move rolling vX / vX.Y aliases, and publish a GitHub Release.'
author: 'DataLabHell'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  version-file:
    description: 'Path to the file holding MAJOR.MINOR (e.g. "0.1")'
    required: false
    default: 'VERSION'
  github-token:
    description: 'Token used to push tags and create the release. Pass secrets.GITHUB_TOKEN from the calling workflow.'
    required: true
  release-notes:
    description: 'Generate GitHub Release notes automatically'
    required: false
    default: 'true'

outputs:
  version:
    description: 'The full version released, e.g. 0.1.3 (empty if nothing released)'
    value: ${{ steps.ver.outputs.version }}
  tag:
    description: 'The tag created, e.g. v0.1.3 (empty if nothing released)'
    value: ${{ steps.ver.outputs.new_tag }}

runs:
  using: 'composite'
  steps:
    - name: Compute next version
      id: ver
      shell: bash
      run: bash "${{ github.action_path }}/version.sh"
      env:
        INPUT_VERSION_FILE: ${{ inputs.version-file }}

    - name: Tag and move aliases
      shell: bash
      run: bash "${{ github.action_path }}/tag.sh"
      env:
        NEW_TAG: ${{ steps.ver.outputs.new_tag }}
        MAJOR: ${{ steps.ver.outputs.major }}
        MINOR: ${{ steps.ver.outputs.minor }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.ver.outputs.new_tag }}
        name: ${{ steps.ver.outputs.new_tag }}
        generate_release_notes: ${{ inputs.release-notes }}
        token: ${{ inputs.github-token }}
