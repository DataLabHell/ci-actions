name: 'Auto Release'
description: 'VERSION-file driven releases: auto-increment the patch, tag, move rolling vX / vX.Y aliases, and publish a GitHub Release.'
author: 'DataLabHell'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  version-file:
    description: 'Path to the file holding MAJOR.MINOR (e.g. "1.0")'
    required: false
    default: 'VERSION'
  github-token:
    description: 'Token used to push tags and create the release. Pass ${{ secrets.GITHUB_TOKEN }}.'
    required: true
  release-notes:
    description: 'Generate GitHub Release notes automatically'
    required: false
    default: 'true'

outputs:
  version:
    description: 'The full version released, e.g. 1.2.3 (empty if nothing released)'
    value: ${{ steps.ver.outputs.version }}
  tag:
    description: 'The tag created, e.g. v1.2.3 (empty if nothing released)'
    value: ${{ steps.ver.outputs.new_tag }}

runs:
  using: 'composite'
  steps:
    - name: Compute next version
      id: ver
      shell: bash
      run: |
        set -euo pipefail

        VERSION_FILE="${{ inputs.version-file }}"
        if [ ! -f "$VERSION_FILE" ]; then
          echo "::error::version file '$VERSION_FILE' not found. Create it containing MAJOR.MINOR, e.g. 1.0"
          exit 1
        fi

        MM="$(tr -d ' \t\n\r' < "$VERSION_FILE")"   # e.g. 1.0
        if ! [[ "$MM" =~ ^[0-9]+\.[0-9]+$ ]]; then
          echo "::error::$VERSION_FILE must be MAJOR.MINOR (e.g. 1.0); got '$MM'"
          exit 1
        fi
        MAJOR="${MM%%.*}"

        # Highest existing patch for this major.minor series (-1 if none yet).
        HIGHEST=-1
        while read -r t; do
          [ -z "$t" ] && continue
          p="${t#v${MM}.}"                          # strip "v1.0." -> patch
          [[ "$p" =~ ^[0-9]+$ ]] || continue        # ignore pre-releases etc.
          (( p > HIGHEST )) && HIGHEST="$p"
        done < <(git tag -l "v${MM}.*")

        PATCH=$(( HIGHEST + 1 ))
        NEW="v${MM}.${PATCH}"

        echo "version=${MM}.${PATCH}" >> "$GITHUB_OUTPUT"
        echo "new_tag=$NEW"           >> "$GITHUB_OUTPUT"
        echo "major=v${MAJOR}"        >> "$GITHUB_OUTPUT"
        echo "minor=v${MM}"           >> "$GITHUB_OUTPUT"
        echo "Next version: $NEW"

    - name: Tag and move aliases
      shell: bash
      run: |
        set -euo pipefail
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        NEW="${{ steps.ver.outputs.new_tag }}"
        git tag -a "$NEW" -m "$NEW"
        git push origin "$NEW"

        for ALIAS in "${{ steps.ver.outputs.major }}" "${{ steps.ver.outputs.minor }}"; do
          echo "Moving $ALIAS -> $NEW"
          git tag -f "$ALIAS" "$NEW"
          git push origin "$ALIAS" --force
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.ver.outputs.new_tag }}
        name: ${{ steps.ver.outputs.new_tag }}
        generate_release_notes: ${{ inputs.release-notes }}
        token: ${{ inputs.github-token }}
