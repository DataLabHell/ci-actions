name: "Docker build & push"
description:
  "Build a container image with Buildx and push it to GHCR or the local
  registry, with sha/latest/version tags and layer caching."
author: "DataLabHell"

branding:
  icon: "package"
  color: "blue"

# Composite wrapper around docker/setup-buildx-action, docker/login-action and
# docker/build-push-action. The caller owns the job (runner, matrix,
# `permissions: packages: write` for GHCR, checkout).
inputs:
  image:
    description:
      'Final path segment of the image, e.g. "api" -> <registry>/<namespace>/api'
    required: true
  namespace:
    description:
      "Path between registry and image. Defaults to this repo (owner/name),
      matching GHCR."
    required: false
    default: "${{ github.repository }}"
  registry:
    description:
      'Registry host. "ghcr.io" (alias "ghcr") logs in with GITHUB_TOKEN, any
      other host with `username` and `password`.'
    required: false
    default: "ghcr.io"
  tags:
    description:
      "Newline-separated tag suffixes (each becomes <ref>:<suffix>). Blank lines
      are skipped, so an optional version expression may be empty."
    required: false
    default: "latest"
  context:
    description: "Build context directory"
    required: false
    default: "."
  dockerfile:
    description:
      "Path to the Dockerfile (empty = the default Dockerfile in the context)"
    required: false
    default: ""
  cache:
    description:
      "Layer cache backend: gha (GitHub-hosted), registry (self-hosted/local),
      or none"
    required: false
    default: "gha"
  push:
    description: 'Push the image (set "false" for PR validation builds)'
    required: false
    default: "true"
  platforms:
    description:
      'Target platforms, newline- or comma-separated (e.g. "linux/amd64,
      linux/arm64" for a Raspberry Pi 5). Empty = the runner''s native platform
      only. Runners are x86-64, so non-amd64 platforms are built under QEMU
      emulation and take noticeably longer.'
    required: false
    default: ""
  build-contexts:
    description:
      'Additional named build contexts, one "name=source" per line, passed to
      docker/build-push-action unchanged (e.g.
      "base=docker-image://ghcr.io/org/repo/base:<sha>"). A Dockerfile refers to
      a context by name in FROM or COPY --from. Empty = none.'
    required: false
    default: ""
  username:
    description: "Registry username. Required unless the registry is ghcr.io."
    required: false
    default: ""
  password:
    description: "Registry password. Required unless the registry is ghcr.io."
    required: false
    default: ""

# ghcr.io logs in with the workflow's GITHUB_TOKEN, any other registry with
# username and password.
outputs:
  ref:
    description:
      "The fully-qualified image ref (without tag), e.g. ghcr.io/org/repo/api"
    value: ${{ steps.prep.outputs.ref }}

runs:
  using: "composite"
  steps:
    # Compute the ref, full tag list and cache args in a lint-checked script.
    - id: prep
      shell: bash
      run: bash "${{ github.action_path }}/build.sh"
      env:
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}

    # Only needed for non-amd64 targets: registers the binfmt handlers that let
    # the x86-64 runner execute foreign-arch build steps.
    - if: ${{ steps.prep.outputs.qemu == 'true' }}
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # build.sh picks the login: "ghcr" (the workflow's GITHUB_TOKEN) or
    # "password" (the username and password inputs).
    - if: ${{ steps.prep.outputs.login == 'ghcr' }}
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ steps.prep.outputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - if: ${{ steps.prep.outputs.login == 'password' }}
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ steps.prep.outputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        platforms: ${{ steps.prep.outputs.platforms }}
        build-contexts: ${{ inputs.build-contexts }}
        tags: ${{ steps.prep.outputs.tags }}
        cache-from: ${{ steps.prep.outputs.cache-from }}
        cache-to: ${{ steps.prep.outputs.cache-to }}
