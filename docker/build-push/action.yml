name: 'Docker build & push'
description: 'Build a container image with Buildx and push it to GHCR or the local registry, with sha/latest/version tags and layer caching.'
author: 'DataLabHell'

branding:
  icon: 'package'
  color: 'blue'

# Composite wrapper around docker/setup-buildx-action, docker/login-action and
# docker/build-push-action. The caller owns the job (runner, matrix,
# `permissions: packages: write` for GHCR, checkout). Because a composite action
# cannot read `secrets.*`, credentials for non-GHCR registries are passed in as
# the `username` / `password` inputs (the caller wires them from its secrets).
inputs:
  image:
    description: 'Final path segment of the image, e.g. "api" -> <registry>/<namespace>/api'
    required: true
  namespace:
    description: 'Path between registry and image. Defaults to this repo (owner/name), matching GHCR.'
    required: false
    default: '${{ github.repository }}'
  registry:
    description: 'Target registry (allowlisted): "ghcr.io" (alias "ghcr") or "truenas.dlh-k8s.com:5000" (alias "truenas").'
    required: false
    default: 'ghcr.io'
  tags:
    description: 'Newline-separated tag suffixes (each becomes <ref>:<suffix>). Blank lines are skipped, so an optional version expression may be empty.'
    required: false
    default: 'latest'
  context:
    description: 'Build context directory'
    required: false
    default: '.'
  dockerfile:
    description: 'Path to the Dockerfile (empty = the default Dockerfile in the context)'
    required: false
    default: ''
  cache:
    description: 'Layer cache backend: gha (GitHub-hosted), registry (self-hosted/local), or none'
    required: false
    default: 'gha'
  push:
    description: 'Push the image (set "false" for PR validation builds)'
    required: false
    default: 'true'

# Authentication is decided by the registry. You never pass credentials:
#   ghcr.io  -> logs in with the workflow's GITHUB_TOKEN
#   truenas  -> no login step; uses the credentials configured on the runner
outputs:
  ref:
    description: 'The fully-qualified image ref (without tag), e.g. ghcr.io/org/repo/api'
    value: ${{ steps.prep.outputs.ref }}

runs:
  using: 'composite'
  steps:
    # Compute the ref, full tag list and cache args in a lint-checked script.
    - id: prep
      shell: bash
      run: bash "${{ github.action_path }}/build.sh"
      env:
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_PUSH: ${{ inputs.push }}

    - uses: docker/setup-buildx-action@v3

    # Login is decided per registry by build.sh: true for GHCR (uses the
    # workflow's GITHUB_TOKEN), false for the local registry (uses the runner's
    # configured credentials, so the push is still authenticated).
    - if: ${{ steps.prep.outputs.login == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ steps.prep.outputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ steps.prep.outputs.tags }}
        cache-from: ${{ steps.prep.outputs.cache-from }}
        cache-to: ${{ steps.prep.outputs.cache-to }}
