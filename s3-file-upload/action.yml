name: 'S3 File Upload'
description: 'Upload files/folders from a repo to any S3-compatible bucket (RustFS, AWS S3, MinIO, on-prem, etc.), with glob include/exclude filtering.'
author: 'DataLabHell'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  bucket:
    description: 'Target S3 bucket name'
    required: false
    default: 'reports'
  profile:
    description: 'Named AWS CLI profile configured on the runner (e.g. via ~/.aws/config + ~/.aws/credentials). The profile provides the endpoint, region, addressing style and credentials. Set to "" to instead use AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from the environment.'
    required: false
    default: 'dlh'
  region:
    description: 'S3 region. Only used when no profile is set (with a profile, the region comes from the profile).'
    required: false
    default: 'at-west-1'
  source:
    description: 'Folder in the repo to upload from'
    required: false
    default: 'outputs'
  destination:
    description: 'Destination prefix/subfolder inside the bucket'
    required: false
    default: ''
  include:
    description: 'Comma-separated glob pattern(s) of files to include, relative to "source" (e.g. "**/*.html,**/*.css"). Defaults to HTML files only; set to "**/*" to upload everything.'
    required: false
    default: '**/*.html'
  exclude:
    description: 'Comma-separated glob pattern(s) of files to exclude (applied after include)'
    required: false
    default: ''
  path-style:
    description: 'Use path-style addressing. Only used when no profile is set (with a profile, addressing style comes from the profile).'
    required: false
    default: 'true'
  delete-removed:
    description: 'Delete files in the destination that no longer exist in source (adds --delete)'
    required: false
    default: 'false'
  extra-args:
    description: 'Any additional raw flags to append to the aws s3 sync command'
    required: false
    default: ''

outputs:
  s3-path:
    description: 'The resulting s3:// path files were uploaded to'
    value: ${{ steps.upload.outputs.s3-path }}

runs:
  using: 'composite'
  steps:
    - name: Check AWS CLI is available
      shell: bash
      run: |
        if ! command -v aws &> /dev/null; then
          echo "::error::aws CLI not found on this runner. Install AWS CLI v2 on the runner (GitHub-hosted runners already include it). See: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html"
          exit 1
        fi
        aws --version

    - name: Upload to S3
      id: upload
      shell: bash
      run: |
        set -euo pipefail

        PROFILE="${{ inputs.profile }}"

        # Connection settings + credentials:
        #   - With a profile (default): the endpoint, region, addressing style and
        #     credentials all come from that profile in the runner's ~/.aws/config
        #     and ~/.aws/credentials. The action does NOT touch the AWS config, so
        #     the profile's endpoint_url etc. take effect.
        #   - Without a profile: credentials come from AWS_ACCESS_KEY_ID /
        #     AWS_SECRET_ACCESS_KEY in the environment, and a job-scoped config is
        #     synthesized from the region/path-style inputs (targets real AWS S3).
        PROFILE_ARGS=()
        CONFIG_FILE=""
        if [ -n "$PROFILE" ]; then
          PROFILE_ARGS+=(--profile "$PROFILE")
        elif [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
          echo "::error::No S3 credentials. Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the environment, or set the 'profile' input to use an AWS profile configured on the runner."
          exit 1
        fi

        SOURCE="${{ inputs.source }}"
        DEST_PREFIX="${{ inputs.destination }}"
        DEST="s3://${{ inputs.bucket }}"
        if [ -n "$DEST_PREFIX" ]; then
          DEST="$DEST/${DEST_PREFIX#/}"
        fi

        if [ ! -d "$SOURCE" ]; then
          echo "::error::source folder '$SOURCE' does not exist"
          exit 1
        fi

        # No profile: synthesize a job-scoped AWS config from the inputs (avoids
        # mutating any shared config on self-hosted runners). With a profile this
        # is skipped so the profile's own config is used.
        if [ -z "$PROFILE" ]; then
          CONFIG_FILE="$(mktemp)"
          {
            echo "[default]"
            echo "region = ${{ inputs.region }}"
            if [ "${{ inputs.path-style }}" = "true" ]; then
              echo "s3 ="
              echo "  addressing_style = path"
            fi
          } > "$CONFIG_FILE"
          export AWS_CONFIG_FILE="$CONFIG_FILE"
        fi

        # Build include/exclude filters. AWS CLI applies filters in order given,
        # so we exclude everything first, then re-include the requested patterns,
        # then apply any explicit excludes on top of that.
        FILTER_ARGS=(--exclude "*")
        IFS=',' read -ra INCLUDES <<< "${{ inputs.include }}"
        for pattern in "${INCLUDES[@]}"; do
          pattern="$(echo "$pattern" | xargs)"
          [ -n "$pattern" ] && FILTER_ARGS+=(--include "$pattern")
        done
        if [ -n "${{ inputs.exclude }}" ]; then
          IFS=',' read -ra EXCLUDES <<< "${{ inputs.exclude }}"
          for pattern in "${EXCLUDES[@]}"; do
            pattern="$(echo "$pattern" | xargs)"
            [ -n "$pattern" ] && FILTER_ARGS+=(--exclude "$pattern")
          done
        fi

        DELETE_ARGS=()
        if [ "${{ inputs.delete-removed }}" = "true" ]; then
          # --delete against a bare bucket root would mirror-delete every other
          # pipeline's files in this (shared) bucket. Require a destination prefix.
          if [ -z "$DEST_PREFIX" ]; then
            echo "::error::delete-removed=true requires a non-empty 'destination' prefix; refusing to run --delete against the bucket root '$DEST'"
            exit 1
          fi
          DELETE_ARGS+=(--delete)
        fi

        echo "Uploading '$SOURCE' -> '$DEST'"
        aws s3 sync "$SOURCE" "$DEST" \
          "${PROFILE_ARGS[@]}" \
          "${FILTER_ARGS[@]}" \
          "${DELETE_ARGS[@]}" \
          ${{ inputs.extra-args }}

        echo "s3-path=$DEST" >> "$GITHUB_OUTPUT"
        if [ -n "$CONFIG_FILE" ]; then
          rm -f "$CONFIG_FILE"
        fi
