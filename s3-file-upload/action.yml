name: "S3 File Upload"
description:
  "Upload files/folders from a repo to any S3-compatible bucket (RustFS, AWS S3,
  MinIO, on-prem, etc.), with glob include/exclude filtering."
author: "DataLabHell"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  bucket:
    description: "Target S3 bucket name"
    required: false
    default: "reports"
  profile:
    description:
      "Named AWS CLI profile configured on the runner (~/.aws/config +
      ~/.aws/credentials), providing endpoint, region and credentials. Used only
      when 'access-key-id' and 'secret-access-key' are not given. Left empty,
      the AWS CLI resolves credentials itself (AWS_* vars, OIDC role, instance
      profile)."
    required: false
    default: ""
  access-key-id:
    description:
      "Access key to authenticate with instead of a runner profile. Pass from
      secrets. Requires 'secret-access-key'."
    required: false
    default: ""
  secret-access-key:
    description: "Secret key matching 'access-key-id'. Pass from secrets."
    required: false
    default: ""
  session-token:
    description: "Optional session token, for temporary credentials."
    required: false
    default: ""
  endpoint-url:
    description:
      "S3 endpoint URL, e.g. https://s3.example.internal. Required with
      'access-key-id' for non-AWS buckets; overrides the profile's endpoint when
      both are given."
    required: false
    default: ""
  region:
    description:
      "AWS region. Overrides the profile's region when both are given."
    required: false
    default: ""
  source:
    description: "Folder in the repo to upload from"
    required: false
    default: "outputs"
  destination:
    description: "Destination prefix/subfolder inside the bucket"
    required: false
    default: ""
  include:
    description:
      'Comma-separated glob pattern(s) of files to include, relative to "source"
      (e.g. "*.html,*.css"). AWS CLI "*" matches across "/", so "*.html" covers
      every depth; set to "*" to upload everything. Defaults to HTML files only.'
    required: false
    default: "*.html"
  exclude:
    description:
      "Comma-separated glob pattern(s) of files to exclude (applied after
      include)"
    required: false
    default: ""
  delete-removed:
    description:
      "Delete files in the destination that no longer exist in source (adds
      --delete)"
    required: false
    default: "false"

outputs:
  s3-path:
    description: "The resulting s3:// path files were uploaded to"
    value: ${{ steps.upload.outputs.s3-path }}

runs:
  using: "composite"
  steps:
    - name: Upload to S3
      id: upload
      shell: bash
      run: bash "${{ github.action_path }}/upload.sh"
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        INPUT_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        INPUT_SESSION_TOKEN: ${{ inputs.session-token }}
        INPUT_ENDPOINT_URL: ${{ inputs.endpoint-url }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_BUCKET: ${{ inputs.bucket }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_DELETE_REMOVED: ${{ inputs.delete-removed }}
