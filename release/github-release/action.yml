name: "GitHub Release"
description:
  "Publish a GitHub Release for an existing tag, with auto-generated notes and
  optional attached assets."
author: "DataLabHell"

branding:
  icon: "package"
  color: "blue"

inputs:
  tag:
    description: "Existing tag to publish a Release for, e.g. v1.2.3."
    required: true
  github-token:
    description:
      "Token used to create the release. Pass secrets.GITHUB_TOKEN from the
      calling workflow."
    required: true
  release-notes:
    description: "Auto-generate release notes"
    required: false
    default: "true"
  files:
    description:
      "Optional newline- or comma-separated glob(s) of assets to attach to the
      release"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.tag }}
        generate_release_notes: ${{ inputs.release-notes }}
        files: ${{ inputs.files }}
        token: ${{ inputs.github-token }}
