name: Release

# Releases this repo's shared actions using our own auto-release action.
# On every push to main: read VERSION (MAJOR.MINOR), auto-increment the patch,
# tag vMAJOR.MINOR.PATCH, move the rolling vMAJOR / vMAJOR.MINOR aliases, and
# publish a GitHub Release. Bump MAJOR/MINOR by editing VERSION.
on:
  push:
    branches: [main]
    paths:
      - '**/action.yml'   # an action definition changed
      - '**/*.sh'         # an action's script logic changed
      - 'VERSION'         # a major/minor bump
      - '!_template/**'    # ...but not the scaffold
      # README/docs-only changes do NOT cut a release.

permissions:
  contents: write                        # create tags and releases

concurrency:
  group: release                         # never release twice at once
  cancel-in-progress: false

jobs:
  # Lint must pass before anything is tagged/released.
  lint:
    uses: ./.github/workflows/lint.yml

  release:
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history + tags for version diff

      # Use the action from this repo (local path — no tag bootstrapping needed).
      - uses: ./auto-release
        with:
          version-file: VERSION
          github-token: ${{ secrets.GITHUB_TOKEN }}
