name: CI

# Quality gate for this repo's own sources. The tools (shellcheck, shfmt, taplo)
# and what they check live in mise.toml, so `mise run check` is the same command
# here and on a laptop. It fails the job if any of them finds an issue:
#   - shellcheck: shell correctness / bugs
#   - shfmt:      shell whitespace / indentation / formatting
#   - taplo:      TOML lint + formatting
# Tool provisioning goes through this repo's own mise-setup action (local path,
# so a PR is gated by the version of the action it contains).
# Runs on pull requests (which covers feature branches via the PR's head branch)
# and is called by the release workflow as a prerequisite for main. There's no
# push trigger, so a PR never fires CI twice and no run gets cancelled.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: ./mise-setup
      - name: Run quality gate
        run: mise run check
