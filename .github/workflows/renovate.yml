name: Renovate

# PUBLISHED reusable workflow (no leading underscore). Consumers call it as
#   DataLabHell/ci-actions/.github/workflows/renovate.yml@vX.Y
# and own only the trigger; this file owns the job body: runner, permissions,
# concurrency, the pinned third-party action and the registry host rules.
#
# `on: schedule` is deliberately absent: a called workflow's own triggers are
# ignored, so the cron lives in the caller's stub. See the README for it.
#
# Renovate's own rules (which deps, which schedule, grouping) stay in each
# repo's renovate.json - this workflow only runs the bot.
on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label for the job."
        type: string
        required: false
        default: "self-hosted"
      log-level:
        description: "Renovate LOG_LEVEL. Set to debug to trace a run that finds nothing."
        type: string
        required: false
        default: "info"
    secrets:
      RENOVATE_TOKEN:
        # Underscored, unlike every kebab-case input in this repo: GitHub secret
        # names cannot contain hyphens.
        description: "PAT with contents + pull-request write. GITHUB_TOKEN will not do: pull requests it opens do not trigger the consumer's CI."
        required: true

permissions:
  contents: read
  packages: read # the ghcr host rule below reads image tags with GITHUB_TOKEN

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false # never interrupt a run mid-pull-request-creation

jobs:
  renovate:
    name: Renovate Dependencies
    runs-on: ${{ inputs.runs-on }}
    steps:
      # Renovate clones the repo itself, so this is only here to put a
      # workspace-local config (RENOVATE_CONFIG_FILE) within reach. Keep it:
      # dropping it makes that path silently impossible.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Scope the run to the calling repo, so one config serves every consumer.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Let Renovate read private ghcr images (digest + tag lookups) with the
          # job's own GITHUB_TOKEN, which needs no extra secret.
          RENOVATE_HOST_RULES: |
            [
              {
                "hostType": "docker",
                "matchHost": "ghcr.io",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]
          LOG_LEVEL: ${{ inputs.log-level }}
