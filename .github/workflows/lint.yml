name: Lint

# Lint the action shell scripts (*.sh) with the ShellCheck action, which
# auto-discovers shell files in the repo. Runs on PRs, and is also called by the
# release workflow as a prerequisite (workflow_call).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
