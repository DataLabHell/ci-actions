name: Lint

# Lint the action shell scripts on a GitHub-hosted runner (nothing is installed
# on our self-hosted runners). action-sh-checker bundles both tools and fails
# the job if either finds an issue:
#   - shellcheck: correctness / bugs
#   - shfmt:      whitespace / indentation / formatting
# Runs on PRs and is called by the release workflow as a prerequisite.
on:
  push:
    branches-ignore: [main] # main is linted via the release workflow's gate
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: luizm/action-sh-checker@v0.10.0
        env:
          SHFMT_OPTS: -i 2 -ci # 2-space indent, indent case bodies
